name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configuration de Java 17 (Version stable exigée)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installation de Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6
          
          # Forcer l'initialisation du projet Capacitor
          npx cap init "Coach Coinche" "com.coachcoinche.app" --web-dir src --force
          
          # Ajouter Android (sans planter s'il y a un résidu)
          npx cap add android || echo "Plateforme Android prête"
          npx cap sync android

      - name: Compilation APK (Mode Forcé)
        run: |
          cd android
          chmod +x gradlew
          
          # Lancement de la compilation avec sécurités anti-crash GitHub :
          # --no-daemon : empêche le serveur GitHub de saturer sa RAM
          # -x lint : force à ignorer les alertes mineures qui tuent le build
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Mise à disposition de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CoachCoinche-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
