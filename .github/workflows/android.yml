name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configuration de Java 21 (Requis pour Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Installation et génération Android
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/android@latest
          npm install -D @capacitor/cli@latest
          
          # Création forcée du fichier de configuration pour éviter les blocages CLI
          echo '{"appId":"com.coachcoinche.app","appName":"Coach Coinche","webDir":"src","bundledWebRuntime":false}' > capacitor.config.json
          
          npx cap add android
          npx cap sync android

      - name: Compilation de l'APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Mise à disposition de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CoachCoinche-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
