name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configuration Java 17 (Version stable exigée)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installation Capacitor (Mode Forcé)
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/android@latest
          npm install -D @capacitor/cli@latest
          
          # Création du fichier de config MANUELLEMENT (C'est ce qui évite le crash des 30 secondes !)
          echo '{
            "appId": "com.coachcoinche.app",
            "appName": "Coach Coinche",
            "webDir": "src",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          # Sécurité : créer le dossier src s'il n'est pas détecté pour éviter une erreur
          mkdir -p src
          
          npx cap add android
          npx cap sync android

      - name: Compilation APK (Mode Anti-Crash)
        run: |
          cd android
          chmod +x gradlew
          # --no-daemon : empêche le serveur de saturer sa mémoire
          # -x lint : empêche la compilation de s'arrêter pour de simples avertissements de code
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Mise à disposition de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CoachCoinche-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
