<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coach Coinche IA</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        button { background: #E53935; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; font-weight: bold; margin-top: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:disabled { background: #555; }
        #status { margin-top: 20px; font-size: 14px; color: #aaa; }
        #replay-container { display: none; margin-top: 30px; background: #1E1E1E; padding: 15px; border-radius: 12px; text-align: left; }
    </style>
</head>
<body>

    <h1>Coach Coinche</h1>
    <p>Enregistrez votre donne pour l'analyse IA</p>

    <!-- Bouton principal d'action -->
    <button id="recordBtn">🔴 Démarrer l'enregistrement</button>
    
    <!-- Suivi du processus métier -->
    <div id="status">Prêt.</div>

    <!-- Conteneur pour la Phase 4 -->
    <div id="replay-container">
        <h2>Analyse Terminée</h2>
        <pre id="jsonOutput" style="overflow-x: auto; font-size: 12px;"></pre>
    </div>

    <!-- Chargement de nos scripts -->
    <script type="module" src="./js/api.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
